<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Student Stress Estimator</title>
<style>
  :root {
    --bg: #f4f6f7; --panel: rgba(255,255,255,.93); --ink: #1c2a33; --muted: #5f6f78;
    --line: #dbe3e7; --soft: #f3f7f8; --accent: #2f7c82; --accent-soft: #d6ebed;
    --low: #3b9a70; --medium: #d19a35; --high: #c85a51;
    --warn-bg: #fbf4e4; --warn-ink: #6f4d10; --warn-line: #d19a35;
    --overlay: rgba(244,246,247,.90);
    --shadow: 0 1px 2px rgba(20,40,50,.05), 0 8px 24px rgba(20,40,50,.08);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0e1416; --panel: rgba(23,33,36,.94); --ink: #e2eaec; --muted: #8fa0a7;
      --line: #263539; --soft: #1a282b; --accent: #5fb0b6; --accent-soft: #1b3437;
      --low: #53b587; --medium: #e0ae52; --high: #e07a70;
      --warn-bg: #2a2415; --warn-ink: #e9cd8c; --warn-line: #e0ae52;
      --overlay: rgba(14,20,22,.90);
      --shadow: 0 1px 2px rgba(0,0,0,.25), 0 8px 24px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="dark"] {
    --bg: #0e1416; --panel: rgba(23,33,36,.94); --ink: #e2eaec; --muted: #8fa0a7;
    --line: #263539; --soft: #1a282b; --accent: #5fb0b6; --accent-soft: #1b3437;
    --low: #53b587; --medium: #e0ae52; --high: #e07a70;
    --warn-bg: #2a2415; --warn-ink: #e9cd8c; --warn-line: #e0ae52;
    --overlay: rgba(14,20,22,.90);
    --shadow: 0 1px 2px rgba(0,0,0,.25), 0 8px 24px rgba(0,0,0,.35);
  }

  * { box-sizing: border-box; }
  body {
    margin: 0; color: var(--ink); background: var(--bg);
    font: 15px/1.55 "Segoe UI", system-ui, -apple-system, sans-serif;
    min-height: 100vh;
  }
  /* Background photo, softened by a translucent colour overlay so text stays readable. */
  .bg {
    position: fixed; inset: 0; z-index: -1;
    background: linear-gradient(var(--overlay), var(--overlay)), var(--img, none) center / cover no-repeat;
    transition: opacity .6s ease;
  }
  .wrap { max-width: 980px; margin: 0 auto; padding: 22px 16px 40px; }

  header.top { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
  .brand h1 { font-size: clamp(1.2rem, 2.4vw, 1.5rem); margin: 0; font-weight: 650; letter-spacing: -.01em; }
  .brand p { margin: 2px 0 0; font-size: 13px; color: var(--muted); }
  .live {
    display: inline-flex; align-items: center; gap: 9px; font-size: 13px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px; box-shadow: var(--shadow);
  }
  .live i { width: 8px; height: 8px; border-radius: 50%; background: var(--low); animation: pulse 2.4s ease-out infinite; }
  .live b { font-weight: 650; }
  @keyframes pulse {
    0%   { box-shadow: 0 0 0 0 color-mix(in srgb, var(--low) 45%, transparent); }
    70%  { box-shadow: 0 0 0 7px transparent; }
    100% { box-shadow: 0 0 0 0 transparent; }
  }

  .progress { height: 5px; background: var(--line); border-radius: 5px; overflow: hidden; margin-bottom: 8px; }
  .progress > div { height: 100%; width: 0; background: var(--accent); border-radius: 5px; transition: width .5s cubic-bezier(.2,.7,.2,1); }
  .steplabel { font-size: 12.5px; color: var(--muted); margin: 0 0 16px; display: flex; justify-content: space-between; }

  .card {
    background: var(--panel); border: 1px solid var(--line); border-radius: 16px;
    padding: 24px; box-shadow: var(--shadow); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    animation: enter .45s ease both;
  }
  @keyframes enter { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  .card h2 { font-size: 1.25rem; margin: 0 0 6px; font-weight: 650; }
  .sub { color: var(--muted); margin: 0 0 18px; font-size: 14px; }

  .notice {
    background: var(--warn-bg); color: var(--warn-ink); border-left: 3px solid var(--warn-line);
    border-radius: 8px; padding: 10px 14px; font-size: 13.5px; margin: 0 0 16px;
  }

  .welcome ol { padding-left: 20px; margin: 0 0 18px; color: var(--muted); }
  .welcome li { margin: 4px 0; }

  .fields { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 18px 24px; }
  .field-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .field-name { font-size: 14.5px; font-weight: 550; }
  .hint { font-size: 12px; color: var(--muted); }
  .num {
    width: 92px; padding: 6px 8px; border: 1px solid var(--line); border-radius: 8px;
    background: var(--soft); color: var(--ink); font: inherit; font-size: 14px; text-align: right;
  }
  .num:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-color: transparent; }
  input[type=range] { width: 100%; margin: 8px 0 2px; accent-color: var(--accent); }
  .out-of-range { color: var(--warn-ink); font-size: 12px; min-height: 16px; }
  .err { color: #b3372e; font-size: 13px; min-height: 18px; margin: 12px 0 0; }

  .nav { display: flex; justify-content: space-between; gap: 10px; margin-top: 20px; flex-wrap: wrap; }
  button {
    border: 0; border-radius: 10px; padding: 11px 22px; font: inherit; font-size: 15px; cursor: pointer;
    background: var(--accent); color: #fff; font-weight: 600; transition: filter .2s, transform .1s;
  }
  button:hover { filter: brightness(1.06); }
  button:active { transform: scale(.98); }
  button.ghost { background: transparent; color: var(--accent); border: 1px solid var(--accent); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* Welcome landing page */
  .hero {
    background: var(--panel); border: 1px solid var(--line); border-radius: 20px; padding: 44px 40px;
    box-shadow: var(--shadow); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); animation: enter .5s ease both;
  }
  .hero-badge {
    display: inline-block; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; font-weight: 600;
    color: var(--accent); background: var(--accent-soft); padding: 5px 12px; border-radius: 999px; margin-bottom: 14px;
  }
  .hero-title { font-size: clamp(1.9rem, 4.6vw, 2.9rem); line-height: 1.1; margin: 0 0 14px; font-weight: 750; letter-spacing: -.02em; }
  .hero-lead { font-size: 16.5px; color: var(--muted); max-width: 640px; margin: 0 0 24px; }
  .cta {
    font-size: 16px; padding: 14px 28px; border-radius: 12px;
    box-shadow: 0 10px 24px color-mix(in srgb, var(--accent) 35%, transparent);
  }
  .hero-note { font-size: 12.5px; color: var(--muted); margin: 12px 0 0; }
  .feature-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-top: 16px; }
  @media (max-width: 760px) { .feature-grid { grid-template-columns: 1fr; } .hero { padding: 28px 22px; } }
  .feature {
    background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 18px;
    box-shadow: var(--shadow); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .feature .ico { font-size: 22px; }
  .feature h4 { margin: 8px 0 4px; font-size: 15px; }
  .feature p { margin: 0; color: var(--muted); font-size: 13.5px; }
  .steps-card {
    margin-top: 16px; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 20px;
    box-shadow: var(--shadow); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .steps-card h3 { margin: 0 0 12px; font-size: 1rem; }
  .steps { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }
  .step { display: flex; gap: 12px; align-items: center; padding: 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--soft); }
  .step .num {
    width: 30px; height: 30px; border-radius: 50%; background: var(--accent); color: #fff;
    display: grid; place-items: center; font-weight: 700; font-size: 13px; flex: none;
  }
  .step b { display: block; font-size: 14px; }
  .step small { color: var(--muted); font-size: 12px; }

  /* Result page */
  .result-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
  @media (max-width: 760px) { .result-grid { grid-template-columns: 1fr; } }
  .donut-wrap { display: flex; justify-content: center; }
  .donut-wrap svg circle.seg { transition: stroke-dasharray .9s cubic-bezier(.2,.7,.2,1), stroke-dashoffset .9s cubic-bezier(.2,.7,.2,1); }
  .donut-text { font-size: 24px; font-weight: 650; fill: var(--ink); }
  .donut-label { font-size: 13px; fill: var(--muted); }
  .legend-row { margin: 12px 0 0; }
  .legend-row .top { display: flex; justify-content: space-between; font-size: 14px; }
  .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 7px; }
  .bar { height: 6px; background: var(--line); border-radius: 6px; overflow: hidden; margin-top: 6px; }
  .bar > div { height: 100%; border-radius: 6px; width: 0; transition: width .9s cubic-bezier(.2,.7,.2,1); }
  .root h3 { font-size: 1rem; margin: 0 0 4px; font-weight: 650; }
  .root .big { font-size: 1.5rem; font-weight: 700; color: var(--accent); margin: 2px 0 6px; }
  .factor-row { margin: 12px 0 0; }
  .factor-row .top { display: flex; justify-content: space-between; font-size: 14px; }
  .factor-row .top span:last-child { color: var(--muted); font-size: 13px; }
  .factor-bar { height: 8px; background: var(--line); border-radius: 6px; overflow: hidden; margin-top: 5px; }
  .factor-bar > div { height: 100%; background: var(--accent); border-radius: 6px; width: 0; transition: width .9s cubic-bezier(.2,.7,.2,1); }
  .disclaimer { font-size: 12.5px; color: var(--muted); margin-top: 18px; }
  .top-factors { margin: 6px 0 0; padding: 0; list-style: none; }
  .top-factors li { display: flex; justify-content: space-between; font-size: 14px; padding: 6px 0; border-bottom: 1px solid var(--line); }
  .top-factors li:last-child { border-bottom: 0; }

  @media (prefers-reduced-motion: reduce) {
    .live i, .card { animation: none !important; }
    *, *::before, *::after { transition: none !important; }
  }
</style>
</head>
<body>
<div class="bg" id="bg"></div>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1>Student Stress Estimator</h1>
      <p>Answer one group at a time. The estimate updates live.</p>
    </div>
    <span class="live" id="live"><i></i><span id="live-text">Live</span></span>
  </header>

  <div class="progress"><div id="progress"></div></div>
  <div class="steplabel"><span id="steplabel"></span><span id="stepcount"></span></div>

  <div class="notice">
    <strong>Research demonstration only.</strong> This is not a medical or diagnostic tool. It shows
    associations learned from one dataset, not causes. If you are concerned about your stress, talk to a qualified professional.
  </div>

  <main id="stage"></main>
  <nav class="nav" id="nav"></nav>
</div>

<script src="model_data.js"></script>
<script src="predict.js"></script>
<script>
(function () {
  const PALETTE = { low: "#3b9a70", medium: "#d19a35", high: "#c85a51", other: "#7f8f98" };
  const colorFor = (label) => PALETTE[String(label).toLowerCase()] || PALETTE.other;
  const GROUPS = [
    { title: "Lifestyle and habits", cols: ["Age", "BMI", "Sleep_Hours", "Screen_Time_Hours", "Social_Media_Hours", "Exercise_Minutes", "Water_Intake_Liters"] },
    { title: "Academic load", cols: ["Study_Hours", "Working_Hours", "Academic_Workload", "Exam_Pressure", "Assignment_Pressure", "Attendance_Percentage"] },
    { title: "Mood and social", cols: ["Anxiety_Level", "Mood_Score", "Financial_Stress", "Family_Stress", "Relationship_Stress", "Social_Support"] },
    { title: "Body measures", cols: ["Heart_Rate", "HRV", "Systolic_BP", "Diastolic_BP", "Respiration_Rate", "Body_Temperature"] },
    { title: "Environment", cols: ["Noise_Level", "Air_Quality_Index"] }
  ];
  const IMG_A = "assets/bg-a.jpg";   // welcome and result pages
  const IMG_B = "assets/bg-b.jpg";   // factor pages
  const C = 2 * Math.PI * 52;
  const SVG_NS = "http://www.w3.org/2000/svg";
  const reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  const model = window.STRESS_MODEL;
  const stage = document.getElementById("stage");
  const nav = document.getElementById("nav");
  const bgEl = document.getElementById("bg");

  if (!model) {
    stage.innerHTML = '<div class="card"><h2>No model found</h2><p class="sub">Run export_numeric_model.py first, then reload this page.</p></div>';
    return;
  }

  function pretty(n) { return n.replace(/_/g, " "); }
  function fmt(v) { return Number.isInteger(v) ? String(v) : v.toFixed(2); }
  function clamp(v, lo, hi) { return Math.min(Math.max(v, lo), hi); }

  // Build the factor groups from the model's features; unlisted features go to "Other".
  const assigned = new Set(GROUPS.flatMap(g => g.cols));
  const groups = GROUPS.map(g => ({ title: g.title, cols: g.cols.filter(c => model.features.includes(c)) }))
    .filter(g => g.cols.length);
  const other = model.features.filter(f => !assigned.has(f));
  if (other.length) groups.push({ title: "Other", cols: other });

  // Steps: 0 = welcome, 1..n = factor groups, n+1 = result.
  const LAST = groups.length + 1;
  const values = {};
  model.features.forEach(n => { const [lo, hi] = model.form_ranges[n]; values[n] = clamp(model.form_defaults[n], lo, hi); });
  const invalid = new Set();
  let step = 0;

  function setBackground(img) { bgEl.style.setProperty("--img", 'url("' + img + '")'); }

  function predictNow() { return window.StressModel.predict(model, values); }
  function topOf(probs) { return probs.reduce((a, b) => (b.probability > a.probability ? b : a)); }

  // Root cause: for the predicted class, how much each feature pushes it above the other classes.
  function attribution() {
    const probs = predictNow();
    const t = model.classes.indexOf(topOf(probs).label);
    const z = model.features.map((n, i) => (values[n] - model.means[i]) / (model.stds[i] || 1));
    const contrib = model.classes.map((_, k) => model.features.map((_, i) => model.coefficients[k][i] * z[i]));
    const attr = model.features.map((_, i) => {
      const mean = contrib.reduce((s, row) => s + row[i], 0) / model.classes.length;
      return contrib[t][i] - mean;
    });
    const groupScores = groups.map(g => ({
      title: g.title,
      score: g.cols.reduce((s, c) => s + attr[model.features.indexOf(c)], 0)
    })).sort((a, b) => b.score - a.score);
    const factorScores = model.features.map((n, i) => ({ name: n, score: attr[i], value: values[n] }))
      .sort((a, b) => b.score - a.score);
    return { probs, top: topOf(probs), groupScores, factorScores };
  }

  function refreshLive() {
    if (invalid.size) return;
    const top = topOf(predictNow());
    document.getElementById("live-text").innerHTML = "Live: <b style='color:" + colorFor(top.label) + "'>" +
      top.label + "</b> · " + Math.round(top.probability * 100) + "%";
  }

  function setProgress() {
    const pct = (step / LAST) * 100;
    document.getElementById("progress").style.width = pct + "%";
    const label = step === 0 ? "Welcome" : step === LAST ? "Result" : "Factor " + step + " of " + groups.length;
    document.getElementById("steplabel").textContent = label;
    document.getElementById("stepcount").textContent = "Step " + (step + 1) + " of " + (LAST + 1);
  }

  function fieldHTML(name) {
    const [lo, hi] = model.form_ranges[name];
    const step = (hi - lo) / 200 || 0.01;
    return "<div><div class='field-head'><span class='field-name'>" + pretty(name) + "</span>" +
      "<input class='num' type='number' step='any' data-num='" + name + "' value='" + fmt(values[name]) + "' aria-label='" + pretty(name) + "'></div>" +
      "<input type='range' min='" + lo + "' max='" + hi + "' step='" + step + "' value='" + values[name] + "' data-range='" + name + "' aria-label='" + pretty(name) + " slider'>" +
      "<div class='hint'>Typical range " + fmt(lo) + " to " + fmt(hi) + "</div>" +
      "<div class='out-of-range' data-warn='" + name + "'></div></div>";
  }

  function bindFields(cols) {
    cols.forEach(function (name) {
      const [lo, hi] = model.form_ranges[name];
      const num = stage.querySelector("[data-num='" + name + "']");
      const slider = stage.querySelector("[data-range='" + name + "']");
      const warn = stage.querySelector("[data-warn='" + name + "']");
      const errEl = document.getElementById("err");
      function apply(v) {
        values[name] = v;
        warn.textContent = (v < lo || v > hi) ? "Outside the typical range; the estimate may be less reliable." : "";
        refreshLive();
      }
      num.addEventListener("input", function () {
        const v = parseFloat(num.value);
        if (isFinite(v)) {
          invalid.delete(name);
          slider.value = clamp(v, lo, hi);
          apply(v);
          errEl.textContent = "";
        } else {
          invalid.add(name);
          errEl.textContent = "Please enter a number for " + pretty(name) + ".";
        }
      });
      slider.addEventListener("input", function () {
        const v = parseFloat(slider.value);
        invalid.delete(name);
        num.value = fmt(v);
        apply(v);
        errEl.textContent = "";
      });
    });
  }

  const words = ["", "one", "two", "three", "four", "five", "six", "seven", "eight"];
  function renderWelcome() {
    setBackground(IMG_A);
    stage.innerHTML =
      "<section class='hero'>" +
        "<span class='hero-badge'>Research demo · 27 everyday factors</span>" +
        "<h2 class='hero-title'>See which everyday factors<br>are linked to student stress</h2>" +
        "<p class='hero-lead'>Answer " + words[groups.length] + " short pages about sleep, study load, mood, body measures and surroundings. " +
        "The estimator predicts a stress category and highlights the factor group behind it.</p>" +
        "<button type='button' id='start' class='cta'>Start the estimate →</button>" +
        "<p class='hero-note'>About two minutes · values start at typical averages</p>" +
      "</section>" +
      "<div class='feature-grid'>" +
        "<div class='feature'><div class='ico'>⚡</div><h4>Live as you go</h4><p>Every change updates the estimate instantly.</p></div>" +
        "<div class='feature'><div class='ico'>🧭</div><h4>Step by step</h4><p>One group of factors per page, so nothing gets lost.</p></div>" +
        "<div class='feature'><div class='ico'>🔍</div><h4>Root-cause view</h4><p>See which group pushes the result most, and the strongest single factors.</p></div>" +
      "</div>" +
      "<section class='steps-card'><h3>What you will answer</h3><div class='steps'>" +
        groups.map(function (g, i) {
          return "<div class='step'><span class='num'>" + (i + 1) + "</span><div><b>" + g.title + "</b><small>" + g.cols.length + (g.cols.length === 1 ? " factor" : " factors") + "</small></div></div>";
        }).join("") +
      "</div></section>";
    nav.innerHTML = "";
  }

  function renderGroup(index) {
    const g = groups[index - 1];
    setBackground(IMG_B);
    stage.innerHTML =
      "<section class='card'><h2>" + g.title + "</h2>" +
      "<p class='sub'>Set each factor with the slider or by typing a number.</p>" +
      "<div class='fields'>" + g.cols.map(fieldHTML).join("") + "</div>" +
      "<p class='err' id='err'></p></section>";
    bindFields(g.cols);
    const isLast = index === groups.length;
    nav.innerHTML = "<button type='button' class='ghost' id='back'>Back</button>" +
      "<button type='button' id='next'>" + (isLast ? "See result" : "Next") + "</button>";
  }

  function renderResult() {
    setBackground(IMG_A);
    const a = attribution();
    const top = a.top;
    const maxAbs = Math.max.apply(null, a.groupScores.map(g => Math.abs(g.score))) || 1;
    const rootGroup = a.groupScores[0];
    const topFactors = a.factorScores.slice(0, 3);
    stage.innerHTML =
      "<section class='card'><h2>Your estimate</h2>" +
      "<p class='sub'>Live result for the answers you entered. Go back to change any value.</p>" +
      "<div class='result-grid'>" +
        "<div>" +
          "<div class='donut-wrap'><svg width='220' height='220' viewBox='0 0 140 140' role='img' aria-label='Probability chart'>" +
            "<g transform='rotate(-90 70 70)' id='segments'></g>" +
            "<text x='70' y='68' text-anchor='middle' class='donut-text' id='center-value'></text>" +
            "<text x='70' y='88' text-anchor='middle' class='donut-label' id='center-label'></text>" +
          "</svg></div>" +
          "<div id='legend'></div>" +
        "</div>" +
        "<div class='root'>" +
          "<h3>Likely root cause</h3>" +
          "<div class='big'>" + rootGroup.title + "</div>" +
          "<p class='sub' style='margin:0 0 6px'>The factor group that pushes the estimate most toward <b>" + top.label + "</b>.</p>" +
          "<div id='groups'></div>" +
          "<h3 style='margin-top:18px'>Strongest individual factors</h3>" +
          "<ul class='top-factors'>" + topFactors.map(f =>
            "<li><span>" + pretty(f.name) + " (" + fmt(f.value) + ")</span><span>" + (f.score >= 0 ? "+" : "") + f.score.toFixed(2) + "</span></li>"
          ).join("") + "</ul>" +
        "</div>" +
      "</div>" +
      "<p class='disclaimer'>This shows which factors the model relied on for these answers. It is an association learned from one dataset, not proof that a factor caused stress, and it is not a diagnosis.</p>" +
      "</section>";

    // Donut: create rings at zero, then animate to the real values.
    const segmentsEl = stage.querySelector("#segments");
    const segs = model.classes.map(function (label) {
      const c = document.createElementNS(SVG_NS, "circle");
      c.setAttribute("class", "seg");
      c.setAttribute("cx", 70); c.setAttribute("cy", 70); c.setAttribute("r", 52);
      c.setAttribute("fill", "none"); c.setAttribute("stroke-width", 14);
      c.setAttribute("stroke", colorFor(label));
      c.style.strokeDasharray = "0 " + C;
      c.style.strokeDashoffset = 0;
      segmentsEl.appendChild(c);
      return c;
    });
    let offset = 0;
    a.probs.forEach(function (p, i) {
      const len = p.probability * C;
      segs[i].setAttribute("data-off", -offset);
      segs[i].setAttribute("data-len", len);
      offset += len;
    });
    requestAnimationFrame(function () {
      segs.forEach(function (c) {
        c.style.strokeDasharray = c.getAttribute("data-len") + " " + (C - c.getAttribute("data-len"));
        c.style.strokeDashoffset = c.getAttribute("data-off");
      });
    });

    countUp(stage.querySelector("#center-value"), Math.round(top.probability * 100));
    stage.querySelector("#center-label").textContent = top.label;

    const legendEl = stage.querySelector("#legend");
    legendEl.innerHTML = a.probs.map(function (p) {
      const pct = (p.probability * 100).toFixed(1);
      return "<div class='legend-row'><div class='top'><span><span class='dot' style='background:" + colorFor(p.label) + "'></span>" +
        p.label + "</span><span>" + pct + "%</span></div>" +
        "<div class='bar'><div data-w='" + pct + "' style='background:" + colorFor(p.label) + "'></div></div></div>";
    }).join("");

    const groupsEl = stage.querySelector("#groups");
    groupsEl.innerHTML = a.groupScores.map(function (g) {
      const w = Math.max(0, g.score) / maxAbs * 100;
      return "<div class='factor-row'><div class='top'><span>" + g.title + "</span><span>" + (g.score >= 0 ? "+" : "") + g.score.toFixed(2) + "</span></div>" +
        "<div class='factor-bar'><div data-w='" + w.toFixed(1) + "'></div></div></div>";
    }).join("");

    requestAnimationFrame(function () {
      stage.querySelectorAll("[data-w]").forEach(function (el) { el.style.width = el.getAttribute("data-w") + "%"; });
    });

    nav.innerHTML = "<button type='button' class='ghost' id='back'>Back to factors</button>" +
      "<button type='button' id='restart'>Start over</button>";
  }

  function countUp(el, target) {
    if (reduceMotion) { el.textContent = target + "%"; return; }
    const start = performance.now(), dur = 900;
    (function tick(t) {
      const k = Math.min(1, (t - start) / dur);
      const eased = 1 - Math.pow(1 - k, 3);
      el.textContent = Math.round(target * eased) + "%";
      if (k < 1) requestAnimationFrame(tick);
    })(start);
  }

  function render() {
    setProgress();
    if (step === 0) renderWelcome();
    else if (step === LAST) renderResult();
    else renderGroup(step);
    refreshLive();
    window.scrollTo({ top: 0, behavior: reduceMotion ? "auto" : "smooth" });
  }

  nav.addEventListener("click", function (e) {
    const id = e.target && e.target.id;
    if (id === "next") {
      if (step > 0 && step < LAST && invalid.size) {
        document.getElementById("err").textContent = "Please fix the highlighted value before continuing.";
        return;
      }
      step = Math.min(step + 1, LAST);
    } else if (id === "back") {
      step = Math.max(step - 1, 0);
    } else if (id === "restart") {
      model.features.forEach(n => { const [lo, hi] = model.form_ranges[n]; values[n] = clamp(model.form_defaults[n], lo, hi); });
      invalid.clear();
      step = 0;
    } else {
      return;
    }
    render();
  });

  stage.addEventListener("click", function (e) {
    if (e.target && e.target.id === "start") { step = 1; render(); }
  });

  render();
})();
</script>
</body>
</html>
